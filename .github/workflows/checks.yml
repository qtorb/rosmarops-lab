name: Checks

# BV-250: lint of the workflows and the lab's own tests, on every PR. No
# environment, no secret, read-only token.

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: actionlint and shellcheck
        run: |
          set -eu
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
          shellcheck lab/*.sh
      - name: Lab tests
        run: python3 lab/test_lab.py
